<div class="header-container">
  <!-- Izquierda: Identidad Institucional (Billing System) -->
  <a href="#factura-nueva" class="header-brand" aria-label="Inicio Billing System">
    <svg width="28" height="28" viewBox="0 0 44 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M14 6L6 11V37L14 32V6Z" fill="#A7F3D0" fill-opacity="0.9" />
      <path d="M14 6L22 11V37L14 32V6Z" fill="#A7F3D0" />
      <path d="M30 11L22 16V42L30 37V11Z" fill="#A7F3D0" fill-opacity="0.8" />
      <path d="M30 11L38 16V42L30 37V11Z" fill="#A7F3D0" fill-opacity="0.95" />
    </svg>
    <span class="brand-title">Billing System</span>
  </a>

  <!-- CENTRO: Encapsulación de navegación con los 2 módulos principales -->
  <div class="nav-center-wrapper">
    <nav class="nav-capsule" id="mainNavCapsule" aria-label="Navegación principal de módulos">
      <!-- Módulo 1: Factura nueva -->
      <button type="button" class="nav-module-btn is-active" data-view="factura-nueva" aria-current="page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span>Factura nueva</span>
      </button>

      <!-- Módulo 2: Catálogo de servicios -->
      <button type="button" class="nav-module-btn" data-view="catalogo" aria-current="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Catálogo</span>
      </button>
    </nav>
  </div>

  <!-- Derecha: Estado de usuario y botón de cierre de sesión desplazado a la derecha -->
  <div class="header-actions">
    <div class="user-info-pill" aria-label="Usuario autenticado">
      <span class="user-avatar" aria-hidden="true">A</span>
      <span class="user-email-text" id="navbarUserEmail">admin@universidad.edu.mx</span>
    </div>

    <button
      type="button"
      class="btn-logout-icon"
      id="navbarLogoutBtn"
      aria-haspopup="dialog"
      aria-label="Cerrar sesión institucional"
      title="Cerrar sesión"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</div>

<!-- Modal Tipo Card de Cierre de Sesión (HTML5 <dialog>) -->
<dialog id="logoutModal" class="logout-dialog" closedby="any" aria-labelledby="logoutModalTitle" aria-describedby="logoutModalDesc">
  <div class="logout-card">
    <!-- Parte 1 (Superior ~1/3): Franja roja horizontal con icono destacado -->
    <header class="logout-card-banner">
      <div class="logout-banner-badge" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <span class="logout-banner-label">Cierre de Sesión</span>
    </header>

    <!-- Parte 2 (En medio): Aviso de confirmación de salida -->
    <div class="logout-card-body">
      <h2 id="logoutModalTitle" class="logout-card-title">¿Deseas cerrar tu sesión?</h2>
      <p id="logoutModalDesc" class="logout-card-desc">
        Estás a punto de salir de <strong>Billing System</strong>. Tu sesión institucional activa finalizará de forma segura.
      </p>

      <div class="logout-user-tag">
        <span class="user-avatar-tag" aria-hidden="true">A</span>
        <span class="user-email-tag" id="modalUserEmail">admin@universidad.edu.mx</span>
      </div>
    </div>

    <!-- Parte 3 (Abajo): Botones para Cancelar o Confirmar -->
    <form method="dialog" class="logout-card-actions">
      <button type="button" class="btn-card-cancel" id="cancelLogoutBtn" autofocus>
        Cancelar
      </button>
      <button type="button" class="btn-card-confirm" id="confirmLogoutBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Confirmar salida</span>
      </button>
    </form>
  </div>
</dialog>
