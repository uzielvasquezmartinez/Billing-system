<section id="viewCatalogo" class="view-panel" aria-labelledby="headingCatalogo">
  <h1 class="page-title" id="headingCatalogo">Catálogo de servicios</h1>

  <div class="catalog-search-bar">
    <label for="catalogSearchInput" class="form-label">Buscar por servicio o SKU</label>
    <input
      type="search"
      id="catalogSearchInput"
      class="form-input"
      placeholder="Ej. hosting o SRV-HOST-001"
      autocomplete="off"
    />
  </div>

  <div class="catalog-layout">
    <!-- Tabla de servicios -->
    <div class="card-panel">
      <table class="catalog-table">
        <thead>
          <tr>
            <th>Servicio</th>
            <th>Categoría</th>
            <th>Tipo</th>
            <th>Precio base</th>
          </tr>
        </thead>
        <tbody id="catalogTableBody"></tbody>
      </table>

      <div class="catalog-pagination">
        <span>Página 1</span>
        <div style="display: flex; gap: var(--space-2);">
          <button type="button" class="btn-page" disabled>Anterior</button>
          <button type="button" class="btn-page" disabled>Siguiente</button>
        </div>
      </div>
    </div>

    <!-- Panel de detalle fiscal y legal -->
    <aside class="card-panel" aria-label="Detalle del servicio">
      <h2 class="catalog-detail-title" id="catalogDetailTitle">Hosting web básico</h2>

      <div class="skus-associated-header">SKU ASOCIADOS</div>
      <div class="sku-pills-list" id="catalogDetailSkus"></div>

      <div>
        <div class="accordion-title">
          <span>Identificación</span>
          <span class="font-mono">10</span>
        </div>
        <div class="accordion-title">
          <span>Comercial</span>
          <span class="font-mono">10</span>
        </div>
        <div class="accordion-title" style="color: var(--color-emerald); font-weight: 700;">
          <span>Fiscal y legal</span>
          <span class="font-mono">12</span>
        </div>

        <!-- Lista de campos fiscales SAT -->
        <div id="catalogFiscalDetails" style="padding: var(--space-2) 0 var(--space-4);"></div>

        <div class="accordion-title">
          <span>Contractual</span>
          <span class="font-mono">9</span>
        </div>
        <div class="accordion-title">
          <span>Operativa</span>
          <span class="font-mono">9</span>
        </div>
      </div>
    </aside>
  </div>
</section>
