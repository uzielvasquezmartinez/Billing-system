<section id="viewCatalogo" class="view-panel" aria-labelledby="headingCatalogo">
  <div class="emitted-title-bar">
    <div>
      <h1 class="page-title" id="headingCatalogo">Catálogo de Servicios</h1>
      <p class="cfdi-doc-subtitle">Consulta de claves tributarias SAT, características de servicio y asociación de SKUs.</p>
    </div>
  </div>

  <div id="catalogAlert" class="alert-container" role="alert" aria-live="assertive"></div>

  <div class="catalog-search-bar">
    <label for="catalogSearchInput" class="form-label">Buscar servicio o SKU</label>
    <div class="input-wrapper">
      <input
        type="search"
        id="catalogSearchInput"
        class="form-input"
        placeholder="Ej. SRV-001 o nombre del servicio"
        autocomplete="off"
      />
    </div>
  </div>

  <div class="catalog-layout">
    <!-- Tabla de servicios -->
    <div class="card-panel">
      <table class="catalog-table" aria-label="Lista de servicios institucionales">
        <thead>
          <tr>
            <th>SKU</th>
            <th>Servicio</th>
            <th>Descripción</th>
            <th>Precio base</th>
          </tr>
        </thead>
        <tbody id="catalogTableBody"></tbody>
      </table>

      <div class="catalog-pagination">
        <span id="catalogPaginationInfo">Cargando servicios...</span>
        <div class="catalog-pagination-actions">
          <button type="button" id="catalogPrevBtn" class="btn-page" disabled aria-label="Página anterior">Anterior</button>
          <button type="button" id="catalogNextBtn" class="btn-page" disabled aria-label="Página siguiente">Siguiente</button>
        </div>
      </div>
    </div>

    <!-- Panel de detalle de servicio (5 secciones / 50 características) -->
    <aside class="card-panel" aria-label="Detalle del servicio">
      <h2 class="catalog-detail-title" id="catalogDetailTitle">Selecciona un servicio</h2>

      <div class="skus-associated-header">SKU ASOCIADOS</div>
      <div class="sku-pills-list" id="catalogDetailSkus"></div>

      <div class="catalog-accordions" id="catalogAccordions"></div>
    </aside>
  </div>
</section>
