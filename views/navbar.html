<div class="header-container">
  <!-- Izquierda: Identidad Institucional -->
  <a href="#factura-nueva" class="header-brand" aria-label="Inicio Sistema de Facturación">

      <path d="M14 6L6 11V37L14 32V6Z" fill="#A7F3D0" fill-opacity="0.9" />

    </svg>
    <span class="brand-title">Facturación</span>
  </a>

    <nav class="nav-capsule" id="mainNavCapsule" aria-label="Navegación principal de módulos">
      <!-- Módulo 1: Factura nueva -->
      <button type="button" class="nav-module-btn is-active" data-view="factura-nueva" aria-current="page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>

          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span>Factura nueva</span>
      </button>

      <!-- Módulo 2: Factura emitida -->
      <button type="button" class="nav-module-btn" data-view="factura-emitida" aria-current="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Factura emitida</span>
      </button>

      <!-- Módulo 3: Catálogo de servicios -->
      <button type="button" class="nav-module-btn" data-view="catalogo" aria-current="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>

          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Catálogo</span>
      </button>
    </nav>
  </div>

  <!-- Derecha: Estado de usuario y botón Salir -->
  <div class="header-actions">
    <span class="sr-only" id="navbarUserEmail">admin@universidad.edu.mx</span>
    <button type="button" class="btn-logout" id="navbarLogoutBtn" aria-label="Cerrar sesión">
      Salir
    </button>
  </div>
</div>
